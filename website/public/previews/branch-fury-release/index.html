<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch’s Fury · release study</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#141923;color:#ece4d5;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto}p{color:#bac2ce}canvas{width:100%;image-rendering:pixelated;background:#20283a;border:1px solid #4d5265;border-radius:8px}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0}button,input{max-width:100%}button{background:#334050;color:white;border:1px solid #687789;border-radius:7px;padding:9px 16px;cursor:pointer}a{color:#8bdfd2}strong{color:#ffcc7e}</style><main><h1>Branch’s Fury · Release</h1><p><strong>Preview only · combat unchanged</strong><br>The approved feral charge leads into a two-glove thrust and a broad fire torrent. No transformation or spinning beam.</p><canvas width="1000" height="400" aria-label="Branch charges then thrusts both gloves forward to release a broad torrent of fire"></canvas><div class="controls"><button id="replay">Replay</button><button id="pause">Pause</button><label>Slow motion <input type="checkbox" id="slow"></label><label>Fire effects <input type="checkbox" id="fire" checked></label><label>Scrub <input type="range" id="seek" min="0" max="5199" value="0"></label><span id="phase">Loading…</span></div><p>Toggle fire off to inspect the two-glove motion. <a href="../branch-fury/">Approved charge</a> · <a href="../../../">Back to game</a></p></main><script>
const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;let charge=[],release=[],clock=0,last=0,ready=false,paused=false;const pause=document.querySelector('#pause'),seek=document.querySelector('#seek'),phase=document.querySelector('#phase');window.seekPreview=ms=>{clock=ms;paused=true;pause.textContent='Resume'};document.querySelector('#replay').onclick=()=>{clock=0;paused=false;pause.textContent='Pause'};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause'};seek.oninput=()=>window.seekPreview(+seek.value);function pix(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function aura(t,p,front){const cx=250,base=340;ctx.globalAlpha=p*(front?.86:1);for(let i=0;i<(front?18:48);i++){const seed=i*7.31+(front?12:0),life=(t*.00125+i*.137)%1,x=cx+Math.sin(seed)*94*(1-life*.46),y=base-life*240,h=(42+38*Math.sin(seed)**2)*(1-life*.5),w=(14+15*Math.cos(seed)**2)*(1-life*.55);if(front&&Math.abs(x-cx)<46)continue;const sway=Math.sin(t*.019+seed)*13;ctx.fillStyle='#c43b17';ctx.beginPath();ctx.moveTo(x-w,y+10);ctx.lineTo(x-w*.8+sway,y-h*.2);ctx.lineTo(x+sway,y-h);ctx.lineTo(x+w*.7,y-h*.3);ctx.lineTo(x+w,y+8);ctx.closePath();ctx.fill();pix(x-w*.5,y-h*.48,w,h*.7,'#ff921e');pix(x-w*.25,y-h*.25,w*.5,h*.42,'#ffe28a');}ctx.globalAlpha=1;for(let i=0;i<65;i++){const life=(t*.00095+i*.173)%1;ctx.globalAlpha=p*(1-life);pix(cx+Math.sin(i*8.1)*125+Math.sin(t*.009+i)*12,base-life*280,2,5,i%2?'#ffc247':'#fff0bc')}ctx.globalAlpha=1}
function torrent(t,p){const start=310,end=start+650*p;for(let x=start;x<end;x+=6){const u=(x-start)/650,shape=Math.min(1,(end-x)/65),width=(35+u*68)*shape,wave=Math.sin(x*.055-t*.025)*9+Math.sin(x*.12-t*.039)*5;pix(x,220-width+wave,9,width*2,'#a52b19');pix(x,220-width*.78+wave,9,width*1.56,'#f35a16');pix(x,220-width*.51+wave*.7,9,width*1.02,'#ffac25');pix(x,220-width*.21+wave*.4,9,width*.42,'#fff0ac')}for(let i=0;i<85;i++){const u=(t*.0018+i*.137)%1;pix(start+u*660*p,220+Math.sin(i*9.1)*(30+u*110),3+i%4,3,'#ffd36c')}}
function draw(now){const dt=last?Math.min(60,now-last):0;last=now;if(ready&&!paused)clock+=dt*(document.querySelector('#slow').checked?.35:1);const t=clock%5200,rt=t-2400,isRelease=rt>=0&&rt<2400,fire=document.querySelector('#fire').checked;let power=t<2400?Math.min(1,t/650):Math.max(0,1-rt/2300),blast=isRelease?Math.max(0,Math.min(1,(rt-550)/270,(2180-rt)/450)):0;ctx.fillStyle='#20283a';ctx.fillRect(0,0,1000,400);pix(0,342,1000,2,'#727078');pix(0,344,1000,56,'#292c35');ctx.fillStyle='#181d29';ctx.beginPath();ctx.ellipse(250,342,70,8,0,0,Math.PI*2);ctx.fill();if(ready){if(fire)aura(t,power,false);const list=isRelease?release:charge,index=t>=4800?0:isRelease?Math.min(list.length-1,Math.floor(rt/2400*list.length)):Math.min(12,Math.floor(t/2400*13)),im=list[index];ctx.drawImage(im,250-im.width,342-212,im.width*2,im.height*2);if(fire){aura(t,power,true);if(blast>0)torrent(t,blast)}phase.textContent=t<650?'Plant & gather':t<2400?'Approved feral charge':rt<550?'Gather both gloves':rt<1900?'Two-glove release':t<4800?'Recoil':'Ready';seek.value=Math.floor(t);window.previewState={ready,time:Math.round(t),frame:index,phase:phase.textContent,paused,fireEffects:fire,blastStrength:blast,transformation:false,combatChanged:false}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
async function loadList(url,prefix){const data=await fetch(url).then(r=>r.json());return Promise.all(data.files.map(src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=prefix+src})))}Promise.all([loadList('../branch-fury/clip.json','../branch-fury/'),loadList('clip.json','')]).then(([a,b])=>{charge=a;release=b;ready=true}).catch(e=>{phase.textContent='Preview failed to load';window.previewState={ready:false,error:String(e)}});
</script></html>
