<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch’s Fury · charge study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141923;color:#ece4d5;font:15px/1.5 system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{margin-bottom:4px}p{color:#bac2ce}canvas{width:100%;background:#20283a;image-rendering:pixelated;border:1px solid #4d5265;border-radius:8px}button,input{max-width:100%}button{background:#334050;color:#fff;border:1px solid #687789;border-radius:7px;padding:9px 16px;cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0}strong{color:#ffcc7e}a{color:#8bdfd2}</style>
<main><h1>Branch’s Fury · Fire charge</h1><p><strong>Preview only · combat unchanged</strong><br>The opening power-up stance with rising fire. Branch stays himself: no transformation, punch, or beam.</p><canvas id="stage" width="800" height="360" aria-label="Branch plants his feet and charges inside a rising flame aura"></canvas><div class="controls"><button id="replay">Replay</button><button id="pause">Pause</button><label>Slow motion <input type="checkbox" id="slow"></label><label>Fire aura <input type="checkbox" id="fire" checked></label><label>Scrub <input type="range" id="seek" min="0" max="3199" value="0"></label><span id="phase">Loading…</span></div><p>Review the planted stance, lowered gloves and fire buildup. Toggle the aura off to inspect the body motion. <a href="../../../">Back to game</a></p></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
let frames=[],clock=0,last=0,paused=false,ready=false;const pause=document.querySelector('#pause'),phase=document.querySelector('#phase'),seek=document.querySelector('#seek');
window.seekPreview=ms=>{clock=ms;paused=true;pause.textContent='Resume'};
document.querySelector('#replay').onclick=()=>{clock=0;paused=false;pause.textContent='Pause'};
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause'};seek.oninput=()=>window.seekPreview(+seek.value);
function pix(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function aura(t,p,front){const cx=400,base=300;ctx.globalAlpha=p*(front?.72:1);for(let i=0;i<(front?9:23);i++){const seed=i*7.31+(front?12:0),life=((t*.00075+i*.137)%1),x=cx+Math.sin(seed)*68*(1-life*.42),y=base-life*230,h=(24+22*Math.sin(seed)**2)*(1-life*.65),w=(10+12*Math.cos(seed)**2)*(1-life*.6);if(front&&Math.abs(x-cx)<35)continue;const sway=Math.sin(t*.011+seed)*6;ctx.fillStyle='#a93520';ctx.beginPath();ctx.moveTo(x-w,y+10);ctx.lineTo(x-w*.8+sway,y-h*.2);ctx.lineTo(x+sway,y-h);ctx.lineTo(x+w*.7,y-h*.3);ctx.lineTo(x+w,y+8);ctx.closePath();ctx.fill();pix(x-w*.5,y-h*.38,w,h*.6,'#f27420');pix(x-w*.25,y-h*.1,w*.5,h*.3,'#ffd16a');}ctx.globalAlpha=1;
for(let i=0;i<24;i++){const life=(t*.0005+i*.173)%1,x=cx+Math.sin(i*8.1)*100+Math.sin(t*.003+i)*5,y=base-life*270;ctx.globalAlpha=p*(1-life);pix(x,y,2,i%3?3:5,i%2?'#ffbe43':'#ffe5a0');}ctx.globalAlpha=1;}
function draw(now){const dt=last?Math.min(60,now-last):0;last=now;if(ready&&!paused)clock+=dt*(document.querySelector('#slow').checked?.35:1);const t=clock%3200,p=Math.max(0,Math.min(1,(t-160)/650,(2700-t)/550));ctx.fillStyle='#20283a';ctx.fillRect(0,0,800,360);pix(0,302,800,2,'#727078');pix(0,304,800,56,'#292c35');ctx.fillStyle='#181d29';ctx.beginPath();ctx.ellipse(400,302,70,8,0,0,Math.PI*2);ctx.fill();const fire=document.querySelector('#fire').checked;
if(ready){if(fire)aura(t,p,false);const index=t>=2800?0:Math.min(frames.length-1,Math.floor(t/2800*frames.length)),im=frames[index],s=2;ctx.drawImage(im,400-im.width*s/2,302-106*s,im.width*s,im.height*s);if(fire)aura(t,p,true);phase.textContent=t<650?'Plant & gather':t<2300?'Fire charge':t<2800?'Release tension':'Ready';seek.value=Math.floor(t);window.previewState={ready,frame:index,phase:phase.textContent,time:Math.round(t),paused,fireAura:fire,auraStrength:p,transformation:false,blast:false,combatChanged:false};}requestAnimationFrame(draw)}requestAnimationFrame(draw);
fetch('clip.json').then(r=>r.json()).then(async data=>{frames=await Promise.all(data.files.map(src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=src})));ready=true}).catch(e=>{phase.textContent='Preview failed to load';window.previewState={ready:false,error:String(e)}});
</script></html>
