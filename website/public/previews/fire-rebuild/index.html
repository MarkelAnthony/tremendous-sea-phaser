<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire — fresh animation review</title><style>body{margin:0;padding:20px;background:#17212e;color:#f7efdf;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto}button{font:inherit;padding:8px 14px;margin:4px;cursor:pointer}img{image-rendering:pixelated;background:#283649;max-width:100%}#pose{width:384px}.strip{display:flex;gap:10px;overflow:auto}.strip button{background:transparent;color:inherit;border:1px solid #536076;padding:4px}.strip img{width:160px;max-width:none}a{color:#9ae7df}</style><main><h1>Fire · fresh animation</h1><p>New motion from the right-facing guard, not edits to the rejected Fire frames. Jab, Heavy, and live combat are unchanged. This clip is for review, not marked approved.</p><button id="play">Play</button><button id="step">Next frame</button><button id="slow">Slow playback</button><p id="status">Loading saved frames…</p><img id="pose" alt="New Fire animation frame"><h2>Every frame, in order</h2><div class="strip" id="strip"></div><p><a href="../branch-combat/">Unchanged Jab and Heavy</a> · <a href="/">Live game</a></p></main><script>let frame=0,playing=false,ready=false,last=0,ms=100,frames=[];const pose=document.getElementById('pose');function draw(){if(!ready)return;pose.src=frames[frame].src;document.getElementById('status').textContent='Frame '+frame+' / '+(frames.length-1)+' · '+(playing?'playing':'paused')+' · '+ms+' ms';}window.setFireFrame=n=>{playing=false;frame=((n%frames.length)+frames.length)%frames.length;document.getElementById('play').textContent='Play';draw();};window.playFire=()=>{if(!ready)return;playing=!playing;last=performance.now();document.getElementById('play').textContent=playing?'Pause':'Play';draw();};document.getElementById('play').onclick=window.playFire;document.getElementById('step').onclick=()=>window.setFireFrame(frame+1);document.getElementById('slow').onclick=()=>{ms=ms===100?300:100;draw();};window.playtest=()=>({ready,frame,playing,totalFrames:frames.length,frameMs:ms,source:pose.getAttribute('src'),liveCombatChanged:false});fetch('frames.json').then(r=>r.json()).then(async paths=>{frames=await Promise.all(paths.map(async p=>{const im=new Image();im.src=p;await im.decode();return im;}));frames.forEach((im,i)=>{const b=document.createElement('button');b.append(im.cloneNode(),document.createTextNode('Frame '+i));b.onclick=()=>window.setFireFrame(i);document.getElementById('strip').append(b);});ready=true;draw();}).catch(e=>document.getElementById('status').textContent='Load failed: '+e.message);function tick(now){if(playing&&ready&&now-last>=ms){frame=(frame+1)%frames.length;last=now;draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
